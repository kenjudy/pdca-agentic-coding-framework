[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdca-skill-tools"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Unit tests — pytest runner only, no API deps
test = [
    "pytest>=9.1.1",
]
# Eval harness — install separately: uv sync --extra eval
eval = [
    "anthropic>=1.0.0",
    "deepeval>=4.1.10",
    "python-dotenv>=1.2.2",
]
lint = [
    "ruff>=0.16.6",
    "mypy>=2.3.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The rubric modules hold verbatim LLM-judge prompt text. Its line breaks are part of the
# string the judge reads, so rewrapping a criterion to satisfy E501 would change the prompt
# -- and tests/test_rubrics.py pins each assembled rubric byte-for-byte precisely to stop
# that happening silently. Long lines here are content, not style.
"eval/rubrics/rubric_*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_evals.py makes real API calls; test_eval_imports.py needs the `eval` extra, which
# the default `test`/`lint` sync does not install. Both are excluded here and run by their
# own means -- run-evals.sh and the eval-imports CI job respectively -- rather than being
# guarded by in-test skips, which would be indistinguishable from passing.
addopts = "--ignore=tests/test_evals.py --ignore=tests/test_eval_imports.py"
markers = [
    "eval: marks tests as LLM evaluation tests (require ANTHROPIC_API_KEY, incur API costs — run with: uv run ./run-evals.sh)",
]
